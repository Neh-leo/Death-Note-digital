<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08080a">
  <meta name="description" content="Death Note digital: una libreta ficticia inspirada en el manga.">
  <title>Death Note Digital</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Kalam:wght@400;700&family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #08080a;
      --bg-radial: #18181f;
      --surface: #101014;
      --surface-2: #16161c;
      --border: #2a2a32;
      --border-2: #383842;
      --text: #f4f4f6;
      --red: #8b0000;
      --red-bright: #ff1e1e;
      --red-glow: rgba(220, 20, 60, 0.5);
      --papel: #e8d595;
      --font-title: 'Cinzel', Georgia, serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-mano: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive;      /* hojas de escritura */
      --font-cartel: 'Kalam', 'Segoe Print', 'Bradley Hand', cursive;      /* portada y reglas */
      --radius: 4px;

      /* Ancho de UNA página. La libreta abierta mide 2 × --W */
      --W: min(420px, calc((100vw - 5rem) / 2));
      /* La altura de página es siempre un múltiplo de la altura de línea */
      --lh: 1.9rem;
      --lineas: 20;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      min-height: 100%;
      background-color: var(--bg);
      background-image: radial-gradient(circle at center, var(--bg-radial) 0%, #050507 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.5;
      display: grid;
      place-items: center;
      padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
    }

    [hidden] { display: none !important; }

    /* ---------- Menú ---------- */
    .menu-container {
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .9), 0 0 25px rgba(139, 0, 0, .25);
      border-radius: 6px;
      width: 100%;
      max-width: 440px;
      padding: clamp(1.75rem, 6vw, 3rem) clamp(1.25rem, 5vw, 2.5rem);
      text-align: center;
    }
    h1 {
      font-family: var(--font-title);
      font-size: clamp(1.6rem, 7vw, 2.3rem);
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255, 255, 255, .35);
      text-wrap: balance;
      margin-bottom: .5rem;
    }
    .divider { height: 2px; width: 70px; background: var(--red); margin: 0 auto 2.5rem; }
    .options { display: flex; flex-direction: column; gap: 1.2rem; }

    .menu-btn {
      display: block;
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--surface-2);
      color: #e2e2e8;
      border: 1px solid var(--border-2);
      border-radius: var(--radius);
      font: 600 1.15rem/1.2 var(--font-title);
      letter-spacing: .1em;
      cursor: pointer;
      transition: background-color .25s, border-color .25s, box-shadow .25s, transform .25s;
    }
    .menu-btn:hover:not(:disabled) {
      background: var(--red);
      border-color: var(--red-bright);
      color: #fff;
      box-shadow: 0 0 18px var(--red-glow);
      transform: translateY(-2px);
    }
    .menu-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 0 8px var(--red-glow); }
    .menu-btn:disabled { opacity: .35; cursor: not-allowed; }
    .menu-btn:focus-visible { outline: 2px solid var(--red-bright); outline-offset: 3px; }
    .menu-btn--chico { display: inline-block; width: auto; padding: .55rem 1.1rem; font-size: .9rem; }

    /* ---------- Libreta ---------- */
    .libreta { width: 100%; max-width: calc(var(--W) * 2 + 70px); display: flex; flex-direction: column; gap: 1.5rem; outline: none; }
    .libreta__barra { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .libreta__indicador { font-size: .85rem; color: #b4b4c0; text-align: center; flex: 1; }

    .visor { position: relative; width: calc(var(--W) * 2); height: calc(var(--lh) * var(--lineas)); margin: 12px auto; }

    /* El libro se desplaza: cerrado queda centrado a la derecha, abierto muestra las dos páginas */
    .libro { position: absolute; inset: 0; transform: translateX(var(--desp, 0px)); transition: transform .8s ease-in-out; }
    .libro[data-estado="cerrado"] { --desp: calc(var(--W) * -.5); }
    .libro[data-estado="fin"]     { --desp: calc(var(--W) * .5); }

    /* Tapa dura detrás de las páginas */
    .fondo {
      position: absolute; top: -12px; bottom: -12px;
      background: linear-gradient(135deg, #15151b, #0a0a0d);
      border: 1px solid var(--border-2);
      box-shadow: 0 25px 50px rgba(0, 0, 0, .9), 0 0 25px rgba(139, 0, 0, .2);
      transition: opacity .4s;
    }
    .fondo--izq { left: -12px; width: calc(var(--W) + 12px); border-radius: 12px 0 0 12px; }
    .fondo--der { left: var(--W); width: calc(var(--W) + 12px); border-radius: 0 12px 12px 0; }
    .libro[data-estado="cerrado"] .fondo--der { border-radius: 4px 12px 12px 4px; }

    /* Canto de las hojas apiladas a cada lado */
    .canto {
      position: absolute; top: 2px; bottom: -6px;
      width: calc(var(--W) + 6px);
      background: repeating-linear-gradient(to right, #d9c98f 0 2px, #b9a76b 2px 3px);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .6);
      transition: opacity .4s;
    }
    .canto--der { left: var(--W); border-radius: 0 6px 6px 0; }
    .canto--izq { left: -6px; border-radius: 6px 0 0 6px; }
    .libro[data-estado="cerrado"] :is(.fondo--izq, .canto--izq),
    .libro[data-estado="fin"] :is(.fondo--der, .canto--der) { opacity: 0; }

    /* Espiral metálica en el lomo (centro del libro) */
    .espiral {
      position: absolute; left: calc(var(--W) - 18px); top: 16px; bottom: 16px; width: 36px;
      display: flex; flex-direction: column; justify-content: space-between;
      z-index: 200; pointer-events: none;
    }
    .anillo {
      height: 9px; border-radius: 5px;
      background: linear-gradient(#f6f6fa, #8a8a95 55%, #4a4a55);
      box-shadow: 0 2px 3px rgba(0, 0, 0, .7);
    }

    /* Hojas: cada una tiene frente (derecha) y dorso (izquierda al girar) */
    .hojas { position: absolute; inset: 0; perspective: 1800px; }
    .hoja {
      position: absolute; top: 0; left: var(--W);
      width: var(--W); height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
    }
    .hoja.girada { transform: rotateY(-180deg); }

    .pagina {
      position: absolute; inset: 0;
      overflow: hidden;
      backface-visibility: hidden;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .7);
    }
    .cara--frente { border-radius: 2px 6px 6px 2px; }
    .cara--dorso  { border-radius: 6px 2px 2px 6px; transform: rotateY(180deg); }

    /* Páginas negras */
    .pagina--negra { background: #000; color: #fff; }
    .pagina--negra::after {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to right, rgba(255, 255, 255, .09), transparent 7%);
    }
    .cara--dorso.pagina--negra::after { background: linear-gradient(to left, rgba(255, 255, 255, .09), transparent 7%); }

    /* Portada */
    .pagina--portada {
      background: radial-gradient(circle at 50% 38%, #20202a 0%, #000 72%);
      display: grid; place-items: center; text-align: center;
    }
    .pagina--portada::before { content: ''; position: absolute; inset: 18px; border: 1px solid rgba(255, 255, 255, .55); pointer-events: none; }
    .portada__titulo {
      padding: 0 2.5rem;
      font: 700 clamp(2.4rem, 8vw, 3.6rem)/1.1 var(--font-cartel);
      text-wrap: balance;
      text-shadow: 0 0 14px rgba(255, 255, 255, .35);
    }
    .portada__linea { width: 70px; height: 2px; background: var(--red); margin: 1.5rem auto 0; }

    /* Reglas: marco blanco decorativo */
    .pagina--reglas::before { content: ''; position: absolute; inset: 14px; border: 2px solid #fff; pointer-events: none; }
    .esquina { position: absolute; width: 10px; height: 10px; background: #fff; transform: translate(-50%, -50%) rotate(45deg); }
    .esquina--a { top: 14px; left: 14px; }
    .esquina--b { top: 14px; left: calc(100% - 14px); }
    .esquina--c { top: calc(100% - 14px); left: 14px; }
    .esquina--d { top: calc(100% - 14px); left: calc(100% - 14px); }

    .reglas {
      position: relative; z-index: 1; height: 100%;
      padding: 3.25rem 2.25rem;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 2.75rem; text-align: center;
    }
    .regla { position: relative; }
    .regla + .regla::before {
      content: ''; position: absolute; top: -1.4rem; left: 50%;
      width: 50px; height: 1px; background: rgba(255, 255, 255, .6); transform: translateX(-50%);
    }
    .regla__titulo { font: 700 1.55rem/1.3 var(--font-cartel); margin-bottom: .35rem; }
    .regla__texto { font: 400 1.05rem/1.4 var(--font-cartel); color: rgba(255, 255, 255, .85); overflow-wrap: anywhere; }

    /* Páginas de escritura: papel amarillento con líneas negras de lado a lado */
    .pagina--libre {
      --sombra-lomo: linear-gradient(to right, rgba(0, 0, 0, .3), transparent 7%);
      background-color: var(--papel);
      background-image:
        var(--sombra-lomo),
        repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), #000 calc(var(--lh) - 1px), #000 var(--lh));
    }
    .cara--dorso.pagina--libre { --sombra-lomo: linear-gradient(to left, rgba(0, 0, 0, .3), transparent 7%); }
    .pagina--libre textarea {
      display: block; width: 100%; height: 100%;
      padding: 0 1.5rem 0 2.25rem;
      background: transparent; border: 0; outline: 0; resize: none; overflow: hidden;
      color: #1b1b2f; caret-color: var(--red);
      font: 500 1.55rem/var(--lh) var(--font-mano);
    }
    .cara--dorso.pagina--libre textarea { padding: 0 2.25rem 0 1.5rem; }
    .pagina--libre textarea:focus-visible { box-shadow: inset 0 0 0 2px rgba(139, 0, 0, .55); }

    /* Pantallas angostas: se ve una sola página y las hojas pasadas quedan al lado, asomando */
    @media (max-width: 720px) {
      :root { --W: min(calc(100vw - 4.5rem), 420px); }
      .libreta { max-width: calc(var(--W) + 40px); }
      .visor { width: calc(var(--W) + 22px); overflow: hidden; }
      .libro, .libro[data-estado="cerrado"] { --desp: calc(var(--W) * -1 + 22px); }
      .libro[data-estado="fin"] { --desp: 0px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- Menú principal -->
  <main class="menu-container" id="menu">
    <h1>Death Note Digital</h1>
    <div class="divider" role="presentation"></div>

    <nav class="options" aria-label="Menú principal">
      <button type="button" class="menu-btn" id="btn-libreta">Usar Death Note</button>
      <!-- Sin acción por ahora -->
      <button type="button" class="menu-btn">Juegos mortales</button>
    </nav>
  </main>

  <!-- Libreta (se muestra al pulsar "Usar Death Note") -->
  <section class="libreta" id="libreta" aria-label="Libreta Death Note" tabindex="-1" hidden>
    <div class="libreta__barra">
      <button type="button" class="menu-btn menu-btn--chico" id="cerrar">Cerrar</button>
      <span class="libreta__indicador" id="indicador" aria-live="polite"></span>
    </div>

    <div class="visor">
      <div class="libro" id="libro" data-estado="cerrado">
        <div class="fondo fondo--izq"></div>
        <div class="fondo fondo--der"></div>
        <div class="canto canto--izq"></div>
        <div class="canto canto--der"></div>
        <div class="hojas" id="hojas"></div>
        <div class="espiral" id="espiral" aria-hidden="true"></div>
      </div>
    </div>

    <div class="libreta__barra">
      <button type="button" class="menu-btn menu-btn--chico" id="anterior">Anterior</button>
      <button type="button" class="menu-btn menu-btn--chico" id="siguiente">Siguiente</button>
    </div>
  </section>

  <script>
    (() => {
      'use strict';

      /* ============================================================
         REGLAS — edita aquí el texto de cada regla.
         Hay 12 (3 por página, 4 páginas). Se numeran solas: Regla 1, Regla 2...
         ============================================================ */
      const REGLAS = [
        'ESCRIBIR REGLA', // Regla 1
        'ESCRIBIR REGLA', // Regla 2
        'ESCRIBIR REGLA', // Regla 3
        'ESCRIBIR REGLA', // Regla 4
        'ESCRIBIR REGLA', // Regla 5
        'ESCRIBIR REGLA', // Regla 6
        'ESCRIBIR REGLA', // Regla 7
        'ESCRIBIR REGLA', // Regla 8
        'ESCRIBIR REGLA', // Regla 9
        'ESCRIBIR REGLA', // Regla 10
        'ESCRIBIR REGLA', // Regla 11
        'ESCRIBIR REGLA'  // Regla 12
      ];
      const TITULO_PORTADA = 'Death Note digital';
      const REGLAS_POR_PAGINA = 3;
      const PAGINAS_DE_REGLAS = 4;
      const PAGINAS_DE_ESCRITURA = 30;
      const ANILLOS = 16;

      /* Cómo se comporta cada tipo de hoja al girar */
      const MATERIALES = {
        tapa:   { ms: 800, skew: 0,   lift: 0  },  // rígida (como antes)
        carton: { ms: 700, skew: 1.5, lift: 4  },  // papel duro: casi no se dobla
        papel:  { ms: 550, skew: 6,   lift: 14 }   // papel normal: flexible y ligero
      };

      const CLAVE_NOTAS = 'deathnote:notas';
      const CLAVE_HOJAS = 'deathnote:hojas';

      const $ = (id) => document.getElementById(id);
      const menu = $('menu'), libreta = $('libreta'), libro = $('libro'), contHojas = $('hojas');
      const indicador = $('indicador'), btnAnterior = $('anterior'), btnSiguiente = $('siguiente');
      const sinAnimacion = window.matchMedia('(prefers-reduced-motion: reduce)');

      /* ---------- Caras del libro, en orden ---------- */
      // Cada hoja tiene 2 caras: [frente, dorso]. Las hojas negras son negras por ambos lados.
      const caras = [{ tipo: 'portada' }, { tipo: 'negra' }];                 // portada y su interior
      for (let p = 0; p < PAGINAS_DE_REGLAS; p++) {
        const reglas = [];
        for (let i = 0; i < REGLAS_POR_PAGINA; i++) {
          const n = p * REGLAS_POR_PAGINA + i;
          reglas.push({ numero: n + 1, texto: REGLAS[n] ?? 'ESCRIBIR REGLA' });
        }
        caras.push({ tipo: 'reglas', reglas });
      }
      caras.push({ tipo: 'negra' }, { tipo: 'negra' });                         // hoja negra (5ª página y su reverso)
      for (let i = 1; i <= PAGINAS_DE_ESCRITURA; i++) caras.push({ tipo: 'libre', id: i });
      if (caras.length % 2) caras.push({ tipo: 'negra' });
      caras.forEach((c, k) => { c.pagina = k - 1; });                           // la portada y su interior no cuentan

      const HOJAS = caras.length / 2;
      const TOTAL_PAGINAS = caras.length - 2;

      const materialDe = (hoja) => {
        const t = caras[hoja * 2].tipo;
        return t === 'portada' ? 'tapa' : t === 'libre' ? 'papel' : 'carton';
      };

      /* ---------- Almacenamiento (con try/catch) ---------- */
      function leer(clave, porDefecto) {
        try { return JSON.parse(localStorage.getItem(clave)) ?? porDefecto; }
        catch { return porDefecto; }
      }
      function escribir(clave, valor) {
        try { localStorage.setItem(clave, JSON.stringify(valor)); }
        catch { /* sin almacenamiento: lo escrito dura solo la sesión */ }
      }

      let notas = leer(CLAVE_NOTAS, {});
      if (typeof notas !== 'object' || Array.isArray(notas)) notas = {};
      let girados = leer(CLAVE_HOJAS, 0);           // cuántas hojas están ya giradas hacia la izquierda
      if (!Number.isInteger(girados) || girados < 0 || girados > HOJAS) girados = 0;

      let temporizador = null;
      const guardarAhora = () => { clearTimeout(temporizador); escribir(CLAVE_NOTAS, notas); };
      const programarGuardado = () => { clearTimeout(temporizador); temporizador = setTimeout(guardarAhora, 300); };
      window.addEventListener('pagehide', guardarAhora);

      /* ---------- Creación de páginas ---------- */
      function el(etiqueta, clase, texto) {
        const nodo = document.createElement(etiqueta);
        if (clase) nodo.className = clase;
        if (texto !== undefined) nodo.textContent = texto;
        return nodo;
      }

      function crearPagina(datos) {
        if (datos.tipo === 'portada') {
          const pagina = el('div', 'pagina pagina--portada');
          const caja = el('div');
          caja.append(el('h2', 'portada__titulo', TITULO_PORTADA), el('div', 'portada__linea'));
          pagina.append(caja);
          return pagina;
        }

        if (datos.tipo === 'reglas') {
          const pagina = el('div', 'pagina pagina--negra pagina--reglas');
          for (const c of ['a', 'b', 'c', 'd']) pagina.append(el('span', `esquina esquina--${c}`));
          const contenedor = el('div', 'reglas');
          for (const r of datos.reglas) {
            const bloque = el('div', 'regla');
            bloque.append(el('h2', 'regla__titulo', `Regla ${r.numero}`), el('p', 'regla__texto', r.texto));
            contenedor.append(bloque);
          }
          pagina.append(contenedor);
          return pagina;
        }

        if (datos.tipo === 'negra') return el('div', 'pagina pagina--negra');

        // Página de escritura
        const pagina = el('div', 'pagina pagina--libre');
        const area = document.createElement('textarea');
        area.value = notas[datos.id] || '';
        area.spellcheck = false;
        area.autocomplete = 'off';
        area.setAttribute('aria-label', `Escribir en la página ${datos.pagina}`);

        // Evita escribir más de lo que cabe en la página
        let previo = { valor: area.value, cursor: area.value.length };
        area.addEventListener('beforeinput', () => {
          previo = { valor: area.value, cursor: area.selectionStart };
        });
        area.addEventListener('input', () => {
          if (area.scrollHeight > area.clientHeight + 1) {
            area.value = previo.valor;
            area.setSelectionRange(previo.cursor, previo.cursor);
            return;
          }
          notas[datos.id] = area.value;
          programarGuardado();
        });

        pagina.append(area);
        return pagina;
      }

      /* ---------- Construcción y estado del libro ---------- */
      const hojas = [];

      function construirLibro() {
        for (let j = 0; j < HOJAS; j++) {
          const contenedor = el('div', 'hoja');
          const frente = crearPagina(caras[j * 2]);
          const dorso = crearPagina(caras[j * 2 + 1]);
          frente.classList.add('cara', 'cara--frente');
          dorso.classList.add('cara', 'cara--dorso');
          contenedor.append(frente, dorso);
          contHojas.append(contenedor);
          hojas.push({ contenedor, frente, dorso, material: materialDe(j) });
        }
        $('espiral').append(...Array.from({ length: ANILLOS }, () => el('span', 'anillo')));
      }

      function textoIndicador() {
        if (girados === 0) return 'Portada';
        const izq = girados * 2 - 2, der = girados * 2 - 1;
        if (girados === HOJAS) return `Página ${izq} de ${TOTAL_PAGINAS}`;
        return izq < 1 ? `Página ${der} de ${TOTAL_PAGINAS}` : `Páginas ${izq}–${der} de ${TOTAL_PAGINAS}`;
      }

      function actualizarInterfaz() {
        libro.dataset.estado = girados === 0 ? 'cerrado' : girados === HOJAS ? 'fin' : 'abierto';
        indicador.textContent = textoIndicador();
        btnAnterior.disabled = girados === 0;
        btnSiguiente.disabled = girados === HOJAS;
        escribir(CLAVE_HOJAS, girados);
      }

      // Deja cada hoja en su sitio: giradas a la izquierda, el resto a la derecha
      function colocar() {
        hojas.forEach((h, j) => {
          const girada = j < girados;
          h.contenedor.classList.toggle('girada', girada);
          h.contenedor.style.zIndex = girada ? 10 + j : 60 - j;
          // Solo las dos caras visibles reciben foco y clics
          h.frente.inert = j !== girados;
          h.dorso.inert = j !== girados - 1;
        });
        actualizarInterfaz();
      }

      /* ---------- Giro de hoja ---------- */
      const suave = (t) => (t < .5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2);

      function fotogramas(material, avanzar) {
        const m = MATERIALES[material];
        if (!m.skew && !m.lift) {   // tapa: giro rígido simple
          const f = ['rotateY(0deg)', 'rotateY(-180deg)'];
          return { frames: (avanzar ? f : [...f].reverse()).map((transform) => ({ transform })), easing: 'ease-in-out' };
        }
        const N = 24, frames = [];
        for (let i = 0; i <= N; i++) {
          const p = suave(i / N);                       // avance con aceleración y frenado
          const angulo = -180 * (avanzar ? p : 1 - p);
          const curva = Math.sin(Math.PI * p);          // 0 al inicio y al final, máximo a la mitad
          frames.push({ transform: `translateZ(${m.lift * curva}px) rotateY(${angulo}deg) skewY(${m.skew * curva}deg)` });
        }
        return { frames, easing: 'linear' };
      }

      let animando = false;

      async function girar(avanzar) {
        const j = avanzar ? girados : girados - 1;
        if (animando || j < 0 || j >= HOJAS) return;
        guardarAhora();

        const h = hojas[j];
        girados += avanzar ? 1 : -1;

        if (sinAnimacion.matches || !h.contenedor.animate) { colocar(); return; }

        animando = true;
        actualizarInterfaz();                           // el libro se recentra mientras gira
        h.frente.inert = h.dorso.inert = true;
        h.contenedor.style.zIndex = 100;

        const { ms, } = MATERIALES[h.material];
        const { frames, easing } = fotogramas(h.material, avanzar);
        const a1 = h.contenedor.animate(frames, { duration: ms, easing, fill: 'forwards' });

        // Sombra: la cara que se aleja se oscurece y la que aparece se aclara
        const luz = avanzar ? ['brightness(1)', 'brightness(.55)'] : ['brightness(.55)', 'brightness(1)'];
        const a2 = h.frente.animate([{ filter: luz[0] }, { filter: luz[1] }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' });
        const a3 = h.dorso.animate([{ filter: luz[1] }, { filter: luz[0] }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' });

        try { await a1.finished; } finally {
          colocar();                                    // estado final real
          a1.cancel(); a2.cancel(); a3.cancel();
          animando = false;
        }
      }

      btnAnterior.addEventListener('click', () => girar(false));
      btnSiguiente.addEventListener('click', () => girar(true));

      /* ---------- Abrir y cerrar ---------- */
      function abrir() {
        if (!hojas.length) construirLibro();
        menu.hidden = true;
        libreta.hidden = false;
        colocar();
        libreta.focus({ preventScroll: true });
      }
      function cerrar() {
        guardarAhora();
        libreta.hidden = true;
        menu.hidden = false;
        $('btn-libreta').focus();
      }

      $('btn-libreta').addEventListener('click', abrir);
      $('cerrar').addEventListener('click', cerrar);

      // Teclado: flechas para pasar página y Esc para cerrar (no mientras se escribe)
      document.addEventListener('keydown', (e) => {
        if (libreta.hidden || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight') girar(true);
        else if (e.key === 'ArrowLeft') girar(false);
        else if (e.key === 'Escape') cerrar();
      });
    })();
  </script>
</body>
</html>
